name: Scrape & Update Data

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = medianoche Colombia (UTC-5)
  workflow_dispatch:       # Ejecutar manualmente desde GitHub

jobs:
  scrape:
    name: Scrape sources & update data.json
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          sudo apt-get install -y libasound2t64 libgbm1 libnss3 libxss1 libasound2t64 libatk-bridge2.0-0 libgtk-3-0
          playwright install chromium

      - name: Run scraper
        run: python scraper.py

      - name: Validate data.json
        run: |
          python -c "
          import json, sys
          with open('data.json', encoding='utf-8') as f:
              data = json.load(f)
          print(f'âœ“ {len(data)} registros vÃ¡lidos')
          if len(data) == 0:
              print('ERROR: data.json vacÃ­o')
              sys.exit(1)
          "

      - name: Commit updated data.json
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Sin cambios en data.json"
          else
            COUNT=$(python -c "import json; print(len(json.load(open('data.json'))))")
            DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "data: ${DATE} â€” ${COUNT} registros"
            git push
            echo "âœ“ data.json actualizado"
          fi

